<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Collatz Conjecture</title>
</head>

<body>

    <nav class="navbar navbar-light bg-light">
        <span class="navbar-brand mb-0 h1 Collatztxt">Collatz conjecture</span>
    </nav>

    <div class="container main">
        <input type="number" step="1" min="1" placeholder="Numbers" id="num_input" class="">
        <button id="submit" class="">Submit</button>
    </div>
    <div class="output">
        <span class="outputSpan"></span>
        <button class="closeBtn">close</button>
    </div>
    <div class="statistics">
        <h3>Sequence Statistics</h3>

        <div>
            <p>Starting Number</p>
            <span id="startingNumber"></span>
        </div>

        <div>
            <p>Total Steps</p>
            <span id="totalSteps"></span>
        </div>
        <div>
            <p>Average Number</p>
            <span id="averageNumber"></span>
        </div>
        <div>
            <p>Highest Number</p>
            <span id="highestNumber"></span>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
        integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
        integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"
        integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>
</body>

</html>
